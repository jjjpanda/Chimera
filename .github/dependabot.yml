version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: develop

  - package-ecosystem: docker
    directories:
      - /
      - /certbot
    schedule:
      interval: weekly
    target-branch: develop

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
